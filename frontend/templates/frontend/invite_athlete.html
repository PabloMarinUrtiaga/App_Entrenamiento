{% extends "frontend/base.html" %}
{% block title %}Invitar Deportista{% endblock %}
{% block content %}
<a href="{% url 'coach-dashboard' %}">&larr; Volver</a>

<h1>Invitar a un Deportista</h1>

{% if sent %}
<p>Invitación enviada correctamente.</p>
{% elif error %}
<p>{{ error }}</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    <label for="email">Gmail del Deportista:</label>
    <input type="email" id="email" name="email" required>
    <button type="submit">Invitar</button>
</form>
{% endblock %}
