{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}App Entrenamiento{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'frontend/style.css' %}">
    <link rel="manifest" href="{% static 'frontend/manifest.json' %}">
    <link rel="icon" href="{% static 'frontend/favicon.ico' %}">
    <meta name="theme-color" content="#1D9E75">
    <script src="https://unpkg.com/[email protected]"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    {% block content %}{% endblock %}

    {% if user.is_authenticated %}
<nav class="bottom-nav">
    {% if user.role == "coach" %}
        <a href="{% url 'coach-dashboard' %}">Deportistas</a>
        <a href="{% url 'exercise-management' %}">Ejercicios</a>
        <a href="{% url 'routine-management' %}">Rutinas</a>
        <a href="{% url 'attendance-register' %}">Asistencia</a>
    {% else %}
        <a href="{% url 'athlete-dashboard' %}">Inicio</a>
        <a href="{% url 'my-results' %}">Resultados</a>
        <a href="{% url 'mark-attendance' %}">Asistencia</a>
    {% endif %}
    <a href="{% url 'my-profile' %}">Perfil</a>
</nav>
{% endif %}
</body>
</html>
